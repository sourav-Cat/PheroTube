<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="w-11/12 mx-auto py-3 flex justify-between iteam-center border-b ">
            <div class="logo mx-3 w-[100px] " ><img src="assests/Logo.png" alt=""></div>
            <div class="search" >
                <input type="text" placeholder="Type here" class="input mx-3" />
            </div>
            <div class="sort" >
                <button class="btn mx-3 ">Search</button>
            </div>
        </nav>
    </header>
    <nav id="categories" class="flex  justify-center p-5 gap-3" >

    </nav>

    <main>
        <section id="videos" class="w-11/12 mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5 py-40" >

        </section>
    </main>

    <!-- Open the modal using ID.showModal() method -->
<button id="showModalData" class="btn hidden" onclick="customModal.showModal()">open modal</button>
<dialog id="customModal" class="modal">
  <div class="modal-box">
    <div id="modal-content"></div>
    <div class="modal-action">
      <form method="dialog">
        <!-- if there is a button in form, it will close the modal -->
        <button class="btn">Close</button>
      </form>
    </div>
  </div>
</dialog>


    <script src="scripts/video.js"></script>
   
</body>
</html>
